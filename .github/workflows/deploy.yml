name: Deploy to Public GitHub Pages Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets dist/
          if [ -f CNAME ]; then cp CNAME dist/; fi

      - name: Push to Public GitHub Pages Repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: 'dist'
          destination-github-username: 'Jack-Reiman'
          destination-repository-name: 'Jack-Reiman.github.io'
          user-email: 'reimanja@uw.edu'
          target-branch: 'main'
